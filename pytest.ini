[pytest]
testpaths = tests
# Repo root must be importable so `phase1`, `phase2`, `phase3` and the shared
# test helpers in tests/_stub_support.py resolve. tests/conftest.py also inserts
# it, this keeps direct `pytest tests/foo.py` invocations working.
pythonpath = .
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
